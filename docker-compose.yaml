x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__WEBSERVER__RBAC: "True"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  restart: unless-stopped
  networks:
    - analytics_net

services:
  postgres:
    image: postgres:16
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: demo_db
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d demo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    <<: *airflow-common
    container_name: airflow
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --firstname admin --lastname admin --role Admin --password admin --email admin@example.com || true &&
        (airflow scheduler &) &&
        exec airflow webserver
      "
    ports:
      - "8080:8080"

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/processed;
      mc mb --ignore-existing local/marts;
      exit 0;
      "
    networks:
      - analytics_net

  jupyter:
    build: ./jupyter
    container_name: jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: jupyter
      JUPYTER_ENABLE_LAB: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - analytics_net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  superset:
    build: ./superset
    container_name: superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: "xK7nQ9pL3mZ8vR2tY6wH4jF1bN5cD0aS-eU_iO+gP="
      SUPERSET_LOAD_EXAMPLES: "no"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_EMAIL: admin@admin.com
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    networks:
      - analytics_net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/bash -c "
      superset db upgrade &&
      superset fab create-admin --username $$ADMIN_USERNAME --firstname Admin --lastname User --email $$ADMIN_EMAIL --password $$ADMIN_PASSWORD || true &&
      superset init &&
      gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 60 'superset.app:create_app()'
      "

networks:
  analytics_net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  superset_home: